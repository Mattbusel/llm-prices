# OpenTelemetry Collector Builder (ocb) manifest for a collector with the genaicost processor.
#
#   ocb --config builder-config.yaml
#   ./otelcol-genaicost/otelcol-genaicost --config collector-config.yaml
#
# ocb releases: https://github.com/open-telemetry/opentelemetry-collector-releases/releases
# (cmd/builder/v0.165.0). Keep every component on the same collector release.
dist:
  name: otelcol-genaicost
  description: OpenTelemetry Collector with the genaicost processor (GenAI span costs from llm-prices)
  output_path: ./otelcol-genaicost

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/otlpjsonfilereceiver v0.165.1

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.165.0
  - gomod: github.com/Mattbusel/llm-prices/otel/genaicostprocessor v0.1.0

connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/signaltometricsconnector v0.165.1

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.165.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.165.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.165.1

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.71.0

# CI end-to-end run: the golden corpus in, priced spans and the cost histogram out to files.
receivers:
  otlp_json_file:
    include: ["${env:GOLDEN_DIR}/*.otlp.json"]
    start_at: beginning

processors:
  genaicost:
    attributes: semconv # the names the Python processor writes and the #443 registry defines
    breakdown: true
    max_span_age: 0s

connectors:
  signal_to_metrics:
    spans:
      - name: gen_ai.client.operation.cost
        description: Monetary cost of a single GenAI client operation.
        unit: "{cost}"
        conditions:
          - span.attributes["gen_ai.usage.cost.amount"] != nil
        attributes:
          - key: gen_ai.usage.cost.currency
          - key: gen_ai.usage.cost.source
        histogram:
          buckets: [0.001, 0.004, 0.016, 0.064, 0.256, 1.024, 4.096, 16.384, 65.536]
          value: Double(span.attributes["gen_ai.usage.cost.amount"])

exporters:
  file/traces:
    path: ${env:OUT_DIR}/traces.json
  file/metrics:
    path: ${env:OUT_DIR}/metrics.json

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp_json_file]
      processors: [genaicost]
      exporters: [file/traces, signal_to_metrics]
    metrics:
      receivers: [signal_to_metrics]
      exporters: [file/metrics]

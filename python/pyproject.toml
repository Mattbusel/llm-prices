[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-prices"
version = "1.8.0"
description = "A hardcoded price table is a bug on a timer. Dated, source-cited LLM API prices for 13 providers, provider-aware model-id lookup, exact decimal costs. Zero dependencies."
readme = { content-type = "text/markdown", text = """
# llm-prices

Dated, source-cited LLM API prices for Python: the same table as the Rust crate
[`llm-prices`](https://crates.io/crates/llm-prices), generated from
[`prices.json`](https://github.com/Mattbusel/llm-prices/blob/main/prices.json). Pure Python, no
dependencies, no network access. Prices are USD per 1M tokens, and every row carries the
provider's pricing page and the date it was checked.

```python
import llm_prices
from llm_prices import Usage

p = llm_prices.lookup("claude-sonnet-4-6")          # also dated, Bedrock, Vertex, prefixed ids
groq = llm_prices.lookup_provider("groq", "openai/gpt-oss-120b")

usage = Usage(input=2_048, cache_read=45_000, cache_write_5m=3_500, output=1_024)
p.cost_usage(usage).total                 # 0.048129 (float)
p.cost_usage(usage, exact=True).total     # Decimal('0.048129')
```

`cost_usage` prices prompt-cache reads, cache writes by lifetime, batch discounts, the
long-context switch, service tiers (`tier="flex"`, `"priority"`, `"fast"`) and data residency
(`inference_geo="us"`).

Moving from tokencost is one import line, same functions and signatures:

```python
from llm_prices.compat.tokencost import calculate_prompt_cost, calculate_completion_cost
```

`llm_prices.litellm.model_cost()` is the table in LiteLLM's model_prices_and_context_window.json
schema, for `litellm.register_model`. Source and docs: https://github.com/Mattbusel/llm-prices
""" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Busel" }]
keywords = ["llm", "pricing", "anthropic", "openai", "gemini", "tokens", "cost", "tokencost", "litellm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Token counting in llm_prices.compat.tokencost (pricing token counts needs nothing).
tokencost = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/Mattbusel/llm-prices"
Source = "https://github.com/Mattbusel/llm-prices/tree/main/python"
Changelog = "https://github.com/Mattbusel/llm-prices/blob/main/python/CHANGELOG.md"
Issues = "https://github.com/Mattbusel/llm-prices/issues"
Documentation = "https://github.com/Mattbusel/llm-prices/blob/main/docs/python.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_prices"]

[tool.hatch.build.targets.sdist]
include = ["src/llm_prices", "tests", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

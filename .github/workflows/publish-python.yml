name: publish python
# Publishes python/ to PyPI as `llm-prices` when a tag py-v<version> is pushed, for example
# py-v1.2.0. The tag must match the version in python/pyproject.toml.
#
# Uses PyPI trusted publishing (no API token): on pypi.org, add a trusted publisher (a pending
# one before the first release) for this repository, workflow publish-python.yml and
# environment pypi.
on:
  push:
    tags: ['py-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: the tag matches python/pyproject.toml and __version__
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          test "py-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1; }
          grep -qx "__version__ = \"$version\"" python/src/llm_prices/__init__.py || { echo "__version__ is not $version"; exit 1; }
      - name: the package data is in sync with prices.json
        run: node scripts/build.mjs --check
      - run: python -m pip install build pytest
      - run: python -m pytest
        working-directory: python
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-prices/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

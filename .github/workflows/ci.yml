name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/scan.test.mjs test/data.test.mjs test/cli.test.mjs test/root.test.mjs
      - name: Rust, Go, Python, npm and root module data are in sync with prices.json
        run: node scripts/build.mjs --check

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        with:
          working-directory: test/fixtures
          fail-on: never
          annotations: false
      - name: the fixtures hold exactly 13 stale prices
        run: test "${{ steps.check.outputs.drift-count }}" = "13"
      - name: this repo itself has no drift
        uses: ./
        with:
          # The generated table files hold OpenRouter's and Bedrock's own prices next to the
          # model makers' (build.mjs --check keeps them in sync with prices.json).
          exclude: |
            test/**
            prices.json
            prices.toml
            litellm.json
            data.mjs
            crate/prices.json
            crate/src/data.rs
            go/prices.json
            js/src/data.ts
            python/src/llm_prices/_data.py
            python/src/llm_prices/litellm.json

  python:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.9' }  # ubuntu-latest (26.04) has no 3.9 build
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest build
      - name: tests and doctests (no runtime dependencies installed)
        run: python -m pytest
      - name: sdist and wheel build, and the wheel passes the tests when installed
        shell: bash
        run: |
          python -m build --outdir dist
          python -m pip install dist/*.whl
          cd tests && python -m pytest -p no:cacheprovider -o pythonpath= -o addopts= --rootdir . .
      - name: type hints check under mypy --strict
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy
          python -m mypy --strict src/llm_prices
      - name: tokencost compat with token counting (tiktoken installed)
        run: |
          python -m pip install tiktoken
          python -m pytest tests/test_tokencost_compat.py

  js:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - { os: windows-latest, node: 18 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: ESM and CommonJS builds, then the tests against both
        run: npm test
      - name: the tarball holds the builds
        run: npm pack --dry-run
      - name: the root module (index.mjs, index.d.ts) matches this build
        run: node ../scripts/rootjs.mjs --check

  crate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crate
    steps:
      - uses: actions/checkout@v5
      - name: crate data matches prices.json
        run: cmp prices.json ../prices.json
      - run: cargo test
      - name: tests with the optional features (rust_decimal, serde)
        run: cargo test --all-features
      - name: clippy on a pinned toolchain (new lints in later stables do not break CI)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          cargo +1.99.0 clippy --all-targets -- -D warnings
          cargo +1.99.0 clippy --all-targets --all-features -- -D warnings
      - name: docs build without warnings (every public item documented)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: MSRV (rust-version in Cargo.toml)
        run: |
          rustup toolchain install 1.70 --profile minimal
          cargo +1.70 check --lib

  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.21', stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: embedded table matches prices.json
        shell: bash
        run: cmp prices.json ../prices.json
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Rust examples
        working-directory: crate
        run: |
          cargo run --example cost
          cargo run --example budget_check
          cargo run --example tiers
      - name: Python examples (against the package in this checkout)
        env:
          PYTHONPATH: python/src
        run: |
          python -m pip install tiktoken litellm
          for f in examples/python/*.py; do echo "== $f"; python "$f"; done
      - name: Go examples
        working-directory: examples/go
        run: |
          go vet ./...
          go test ./...

  litellm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: LiteLLM loads litellm.json and prices calls with it
        run: |
          python -m pip install litellm
          python test/litellm_check.py litellm.json

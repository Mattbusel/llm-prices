name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/scan.test.mjs test/data.test.mjs test/cli.test.mjs test/root.test.mjs
      - name: Rust, Go, Python, npm and root module data are in sync with prices.json
        run: node scripts/build.mjs --check

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        with:
          working-directory: test/fixtures
          fail-on: never
          annotations: false
      - name: the fixtures hold exactly 13 stale prices
        run: test "${{ steps.check.outputs.drift-count }}" = "13"
      - name: this repo itself has no drift
        uses: ./
        with:
          # The generated table files hold OpenRouter's and Bedrock's own prices next to the
          # model makers' (build.mjs --check keeps them in sync with prices.json).
          exclude: |
            test/**
            prices.json
            prices.toml
            litellm.json
            data.mjs
            crate/prices.json
            crate/src/data.rs
            go/prices.json
            js/src/data.ts
            python/src/llm_prices/_data.py
            python/src/llm_prices/litellm.json

  python:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.9' }  # ubuntu-latest (26.04) has no 3.9 build
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest build
      - name: tests and doctests (no runtime dependencies installed)
        run: python -m pytest
      - name: sdist and wheel build, and the wheel passes the tests when installed
        shell: bash
        run: |
          python -m build --outdir dist
          python -m pip install dist/*.whl
          cd tests && python -m pytest -p no:cacheprovider -o pythonpath= -o addopts= --rootdir . .
      - name: type hints check under mypy --strict
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy
          python -m mypy --strict src/llm_prices
      - name: tokencost compat with token counting (tiktoken installed)
        run: |
          python -m pip install tiktoken
          python -m pytest tests/test_tokencost_compat.py

  js:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - { os: windows-latest, node: 18 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: ESM and CommonJS builds, then the tests against both
        run: npm test
      - name: the tarball holds the builds
        run: npm pack --dry-run
      - name: the root module (index.mjs, index.d.ts) matches this build
        run: node ../scripts/rootjs.mjs --check

  crate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crate
    steps:
      - uses: actions/checkout@v5
      - name: crate data matches prices.json
        run: cmp prices.json ../prices.json
      - run: cargo test
      - name: tests with the optional features (rust_decimal, serde)
        run: cargo test --all-features
      - name: clippy on a pinned toolchain (new lints in later stables do not break CI)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          cargo +1.99.0 clippy --all-targets -- -D warnings
          cargo +1.99.0 clippy --all-targets --all-features -- -D warnings
      - name: docs build without warnings (every public item documented)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: MSRV (rust-version in Cargo.toml)
        run: |
          rustup toolchain install 1.70 --profile minimal
          cargo +1.70 check --lib

  costcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: costcheck
    steps:
      - uses: actions/checkout@v5
      - run: cargo test
      - run: cargo fmt --check
      - name: clippy on a pinned toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          cargo +1.99.0 clippy --all-targets -- -D warnings
      - name: fails on the stale fixtures, passes on this repo's own tables
        run: |
          cargo build --release
          bin="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)/release/llm-costcheck"
          if "$bin" tests/fixtures --include-tests --prices ../prices.json; then echo "expected a failure"; exit 1; fi
          "$bin" ../crate --prices ../prices.json --fail-on drift
      - name: MSRV (rust-version in Cargo.toml)
        run: |
          rustup toolchain install 1.74 --profile minimal
          cargo +1.74 check --lib

  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.21', stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: embedded table matches prices.json
        shell: bash
        run: cmp prices.json ../prices.json
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Rust examples
        working-directory: crate
        run: |
          cargo run --example cost
          cargo run --example budget_check
          cargo run --example tiers
      - name: Python examples (against the package in this checkout)
        env:
          PYTHONPATH: python/src
        run: |
          python -m pip install tiktoken litellm
          for f in examples/python/*.py; do echo "== $f"; python "$f"; done
      - name: Go examples
        working-directory: examples/go
        run: |
          go vet ./...
          go test ./...

  litellm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: LiteLLM loads litellm.json and prices calls with it
        run: |
          python -m pip install litellm
          python test/litellm_check.py litellm.json

  otel-go:
    # The genaicost Collector processor (otel/genaicostprocessor) against the go/ module in this
    # checkout, through a Go workspace.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: workspace with the go/ module of this checkout
        run: |
          go work init ./otel/genaicostprocessor
          go work edit -replace github.com/Mattbusel/llm-prices/go=./go
      - name: vet and test
        working-directory: otel/genaicostprocessor
        run: |
          go vet ./...
          go test ./...
      - name: race detector, gofmt and fuzzing (30s per target)
        if: matrix.os == 'ubuntu-latest'
        working-directory: otel/genaicostprocessor
        run: |
          go test -race ./...
          test -z "$(gofmt -l .)"
          go test -run '^$' -fuzz '^FuzzPriceSpan$' -fuzztime 30s .
          go test -run '^$' -fuzz '^FuzzParseLiteLLM$' -fuzztime 30s .
          cd ../../go && GOWORK=off go test -run '^$' -fuzz '^FuzzParseTable$' -fuzztime 30s .

  otel-collector-e2e:
    # Builds a collector with ocb (the example builder-config.yaml, pointed at this checkout),
    # runs the golden corpus through it into files and into Weaver's live check against the
    # GenAI registry of semantic-conventions-genai#443, and checks both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: ocb 0.165.0 and weaver 0.28.0
        run: |
          curl -sSfL -o ocb "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/cmd%2Fbuilder%2Fv0.165.0/ocb_0.165.0_linux_amd64"
          chmod +x ocb
          curl -sSfL "https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-gnu.tar.xz" | tar -xJ
          find . -maxdepth 3 -name weaver -type f -exec mv {} ./weaver-bin \;
          ./weaver-bin --version
      - name: build the collector
        run: |
          sed 's#output_path: ./otelcol-genaicost#output_path: ./dist#' otel/genaicostprocessor/example/builder-config.yaml > builder.yaml
          printf '\nreplaces:\n  - github.com/Mattbusel/llm-prices/otel/genaicostprocessor => %s/otel/genaicostprocessor\n  - github.com/Mattbusel/llm-prices/go => %s/go\n' "$PWD" "$PWD" >> builder.yaml
          ./ocb --config builder.yaml
          ./dist/otelcol-genaicost validate --config otel/genaicostprocessor/example/collector-config.yaml
      - name: golden corpus as JSON lines (the otlp_json_file receiver reads one request per line)
        run: |
          mkdir -p in out weaver-out
          for f in otel/conformance/golden/*.otlp.json; do python -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])),separators=(',',':')))" "$f" > "in/$(basename "$f")"; done
      - name: priced spans and the cost histogram
        env:
          GOLDEN_DIR: ${{ github.workspace }}/in
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          ./dist/otelcol-genaicost --config otel/genaicostprocessor/example/e2e-config.yaml > collector.log 2>&1 &
          collector=$!
          for i in $(seq 1 60); do [ -s out/traces.json ] && [ -s out/metrics.json ] && break; sleep 1; done
          sleep 3; kill $collector || true
          python otel/genaicostprocessor/example/check_e2e.py out otel/conformance/golden prices.json
      - name: Weaver live check against the semantic-conventions-genai#443 registry
        env:
          GOLDEN_DIR: ${{ github.workspace }}/in
          WEAVER_OTLP: 127.0.0.1:4317
        run: |
          ./weaver-bin registry live-check \
            -r "https://github.com/elang2/semantic-conventions-genai.git@feat/operation-cost-conventions[model]" \
            --otlp-grpc-port 4317 --admin-port 4320 --inactivity-timeout 15 \
            --format json -o weaver-out --fail-on none > weaver.log 2>&1 &
          weaver=$!
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:4320/health >/dev/null && break; sleep 1; done
          ./dist/otelcol-genaicost --config otel/genaicostprocessor/example/weaver-config.yaml > collector-weaver.log 2>&1 &
          collector=$!
          wait $weaver
          kill $collector || true
          python otel/genaicostprocessor/example/check_weaver.py weaver-out/live_check.json 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-e2e
          path: |
            out/
            weaver-out/
            *.log

  otel-python:
    # llm-prices-otel against the python/ package of this checkout.
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.9', otel: 'opentelemetry-sdk==1.24.0 opentelemetry-api==1.24.0' }
          - { os: ubuntu-latest, python: '3.13', otel: 'opentelemetry-sdk' }
          - { os: windows-latest, python: '3.12', otel: 'opentelemetry-sdk' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: otel/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ../../python ${{ matrix.otel }} pytest hypothesis build
      - name: tests, doctests and property tests
        run: python -m pytest
      - name: genai-prices source against genai-prices itself
        if: matrix.python == '3.13'
        run: |
          python -m pip install genai-prices
          python -m pytest tests/test_genai_prices.py
      - name: wheel builds and passes the tests when installed
        shell: bash
        run: |
          python -m build --outdir dist
          python -m pip install dist/*.whl
          cd tests && python -m pytest -p no:cacheprovider -o pythonpath= -o addopts= --rootdir . .
      - name: mypy --strict
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy
          python -m mypy --strict src/llm_prices_otel
